name: Auto-update from upstream

# Polls upstream pyrealsense2 on PyPI daily. When upstream publishes a version
# we haven't republished yet, it calls the publish workflow to build the
# aarch64 wheels and upload pyrealsense2-extended at the new version.
#
# (PyPI has no push/webhook for "package updated", so polling on a schedule is
# the standard approach.) Can also be run manually from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.compare.outputs.needs_update }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream vs. published
        id: compare
        run: |
          upstream=$(python3 run/upstream_version.py)
          published=$(curl -s https://pypi.org/pypi/pyrealsense2-extended/json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" \
            || echo "none")
          # Strip our .postN suffix to compare base versions.
          published_base=${published%.post*}
          echo "upstream pyrealsense2:        $upstream"
          echo "published extended (base):    $published_base"
          if [ "$upstream" != "$published_base" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "New upstream version detected — will build + publish."
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          fi

  publish:
    needs: check
    if: needs.check.outputs.needs_update == 'true'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
